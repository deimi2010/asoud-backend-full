# =============================================================================
# Redis Production Configuration
# Optimized for performance, security, and reliability
# =============================================================================

# =============================================================================
# NETWORK AND CONNECTION
# =============================================================================
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300
tcp-backlog 511

# =============================================================================
# GENERAL CONFIGURATION
# =============================================================================
daemonize no
pidfile /var/run/redis.pid
loglevel notice
logfile /var/log/redis/redis.log
databases 16

# =============================================================================
# MEMORY MANAGEMENT
# =============================================================================
# Memory optimization (for 1GB container)
maxmemory 800mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Memory optimization settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# =============================================================================
# PERSISTENCE - HYBRID APPROACH (RDB + AOF)
# =============================================================================

# RDB Configuration
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF Configuration
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# =============================================================================
# SECURITY
# =============================================================================
# Password authentication
# Note: Password is set via command line for environment variable support
# requirepass will be set via --requirepass flag

# Rename dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_b8f2a6c4d9e1"
rename-command SHUTDOWN "SHUTDOWN_a7f3c2b8e9d4"
rename-command DEBUG ""
rename-command EVAL ""
rename-command SCRIPT ""

# ACL configuration file
aclfile /etc/redis/users.acl

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================
# Client connections
maxclients 10000

# Slow log for performance monitoring
slowlog-log-slower-than 10000
slowlog-max-len 128

# Background task frequency
hz 10
dynamic-hz yes

# Threaded I/O (Redis 6+)
io-threads 4
io-threads-do-reads yes

# RDB optimization
rdb-save-incremental-fsync yes

# =============================================================================
# NETWORKING OPTIMIZATION
# =============================================================================
# Socket optimization
tcp-keepalive 300

# =============================================================================
# MONITORING AND METRICS
# =============================================================================
# Enable latency monitoring
latency-monitor-threshold 100

# =============================================================================
# MODULES AND EXTENSIONS
# =============================================================================
# Enable Redis modules if needed
# loadmodule /path/to/module.so

# =============================================================================
# CLIENT OUTPUT BUFFER LIMITS
# =============================================================================
# For normal clients
client-output-buffer-limit normal 0 0 0

# For replica clients
client-output-buffer-limit replica 256mb 64mb 60

# For pubsub clients
client-output-buffer-limit pubsub 32mb 8mb 60

# =============================================================================
# ADVANCED CONFIGURATION
# =============================================================================
# Lua script timeout
lua-time-limit 5000

# Notify configuration
notify-keyspace-events ""

# Protected mode (disabled since we're in Docker)
protected-mode no

# =============================================================================
# REPLICATION (PREPARED FOR FUTURE SCALING)
# =============================================================================
# replica-serve-stale-data yes
# replica-read-only yes
# repl-diskless-sync no
# repl-diskless-sync-delay 5
# repl-ping-replica-period 10
# repl-timeout 60

# =============================================================================
# CLUSTER (PREPARED FOR FUTURE SCALING)
# =============================================================================
# cluster-enabled no
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000