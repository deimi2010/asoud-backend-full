# =============================================================================
# PostgreSQL Production Configuration
# Optimized for performance, security, and reliability
# =============================================================================

# =============================================================================
# CONNECTION AND AUTHENTICATION
# =============================================================================
listen_addresses = '*'
port = 5432
max_connections = 200

# Authentication
authentication_timeout = 60s
password_encryption = scram-sha-256

# SSL Configuration
ssl = on
ssl_ciphers = 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.2'

# =============================================================================
# RESOURCE USAGE (MEMORY)
# =============================================================================
# Memory settings (optimized for 2GB container)
shared_buffers = 512MB                    # 25% of total memory
effective_cache_size = 1536MB             # 75% of total memory
work_mem = 8MB                           # Per-operation memory
maintenance_work_mem = 128MB             # Maintenance operations
autovacuum_work_mem = 128MB              # Autovacuum memory

# Shared memory
dynamic_shared_memory_type = posix
max_files_per_process = 1000
max_locks_per_transaction = 64

# =============================================================================
# RESOURCE USAGE (DISK)
# =============================================================================
# Temporary files
temp_file_limit = 1GB

# =============================================================================
# WRITE AHEAD LOG
# =============================================================================
wal_level = replica
fsync = on
synchronous_commit = on
wal_sync_method = fdatasync

# WAL sizing
max_wal_size = 2GB
min_wal_size = 512MB
wal_keep_size = 1GB

# Checkpoints
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
checkpoint_warning = 30s

# WAL archiving (for backup)
archive_mode = on
archive_command = 'cp %p /backups/wal/%f'
archive_timeout = 1800s

# =============================================================================
# REPLICATION (PREPARED FOR FUTURE SCALING)
# =============================================================================
max_wal_senders = 3
max_replication_slots = 3
track_commit_timestamp = on
hot_standby = on
hot_standby_feedback = on

# =============================================================================
# QUERY TUNING
# =============================================================================
# Planner settings
random_page_cost = 1.1                   # SSD optimization
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

effective_io_concurrency = 200           # SSD optimization
maintenance_io_concurrency = 10

# Parallel query settings
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000

# =============================================================================
# ERROR REPORTING AND LOGGING
# =============================================================================
# Logging settings
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on
log_min_messages = warning

# What to log
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_hostname = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Statement logging
log_statement = 'mod'                    # Log all modifications
log_min_duration_statement = 1000       # Log slow queries (1s+)

# Lock debugging
log_lock_waits = on
deadlock_timeout = 1s

# =============================================================================
# RUNTIME STATISTICS
# =============================================================================
# Statistics collection
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# Query statistics
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on

# =============================================================================
# AUTOVACUUM
# =============================================================================
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_freeze_max_age = 200000000
autovacuum_multixact_freeze_max_age = 400000000
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000

# =============================================================================
# CLIENT CONNECTION DEFAULTS
# =============================================================================
# Statement behavior
search_path = '"$user", public'
default_tablespace = ''
temp_tablespaces = ''
check_function_bodies = on
default_transaction_isolation = 'read committed'
default_transaction_read_only = off
default_transaction_deferrable = off
session_replication_role = 'origin'

# Statement timeout
statement_timeout = 0
lock_timeout = 0
idle_in_transaction_session_timeout = 0

# =============================================================================
# LOCK MANAGEMENT
# =============================================================================
deadlock_timeout = 1s
max_pred_locks_per_transaction = 64

# =============================================================================
# VERSION/PLATFORM COMPATIBILITY
# =============================================================================
array_nulls = on
backslash_quote = safe_encoding
default_with_oids = off
escape_string_warning = on
lo_compat_privileges = off
operator_precedence_warning = off
quote_all_identifiers = off
sql_inheritance = on
standard_conforming_strings = on
synchronize_seqscans = on

# =============================================================================
# ERROR HANDLING
# =============================================================================
exit_on_error = off
restart_after_crash = on

# =============================================================================
# LOCALE AND FORMATTING
# =============================================================================
datestyle = 'iso, mdy'
intervalstyle = 'postgres'
timezone = 'UTC'
timezone_abbreviations = 'Default'
extra_float_digits = 0
client_encoding = utf8

# =============================================================================
# CUSTOM EXTENSIONS AND SETTINGS
# =============================================================================

# Enable useful extensions
# (These should be created in init.sql)
# CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
# CREATE EXTENSION IF NOT EXISTS pg_buffercache;
# CREATE EXTENSION IF NOT EXISTS pgcrypto;
# CREATE EXTENSION IF NOT EXISTS uuid-ossp;