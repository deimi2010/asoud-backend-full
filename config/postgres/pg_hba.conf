# =============================================================================
# PostgreSQL Host-Based Authentication Configuration
# Production security settings
# =============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     scram-sha-256

# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections:
host    all             all             ::1/128                 scram-sha-256

# Allow connections from Docker network
host    all             all             172.20.0.0/16           scram-sha-256

# Allow connections from application containers
host    all             all             172.20.2.0/24           scram-sha-256

# Allow replication connections from localhost, by a user with the
# replication privilege.
local   replication     all                                     scram-sha-256
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256

# Allow replication from Docker network
host    replication     all             172.20.2.0/24           scram-sha-256

# =============================================================================
# SECURITY NOTES:
# 
# 1. We use scram-sha-256 for all authentication (most secure)
# 2. We only allow connections from specific Docker networks
# 3. No 'trust' method is used (would be insecure)
# 4. Prepared for replication setup
# =============================================================================