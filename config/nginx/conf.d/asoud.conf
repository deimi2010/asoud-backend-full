# =============================================================================
# ASOUD Platform - Main Site Configuration
# Complete production-ready configuration with SSL and security
# =============================================================================

# =============================================================================
# HTTP to HTTPS Redirect
# =============================================================================
server {
    listen 80;
    server_name api.asoud.ir asoud.ir;
    
    # Security headers even for HTTP
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# =============================================================================
# MAIN HTTPS SERVER
# =============================================================================
server {
    listen 443 ssl http2;
    server_name api.asoud.ir;

    # ==========================================================================
    # SSL CONFIGURATION
    # ==========================================================================
    ssl_certificate /etc/letsencrypt/live/api.asoud.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.asoud.ir/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.asoud.ir/chain.pem;

    # ==========================================================================
    # SECURITY HEADERS
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; child-src 'none'; worker-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

    # ==========================================================================
    # RATE LIMITING
    # ==========================================================================
    limit_conn conn_limit 20;

    # ==========================================================================
    # STATIC FILES
    # ==========================================================================
    location /static/ {
        alias /var/www/static/;
        
        # Aggressive caching for static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        
        # Compression
        gzip_static on;
        
        # Performance
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # CORS for static assets
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        
        # Security: Block script execution in static files
        location ~* \.(php|jsp|pl|py|asp|sh|cgi|exe)$ {
            deny all;
        }
        
        # Logging
        access_log off;
        log_not_found off;
        
        # Handle missing files gracefully
        try_files $uri =404;
    }

    # ==========================================================================
    # MEDIA FILES
    # ==========================================================================
    location /media/ {
        alias /var/www/media/;
        
        # Moderate caching for media files
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        
        # Security for uploaded files
        location ~* \.(php|jsp|pl|py|asp|sh|cgi|exe|js|html|htm)$ {
            deny all;
        }
        
        # Performance
        sendfile on;
        tcp_nopush on;
        
        # Logging
        access_log off;
        log_not_found off;
        
        try_files $uri =404;
    }

    # ==========================================================================
    # ADMIN PANEL
    # ==========================================================================
    location /admin/ {
        # Strict rate limiting for admin
        limit_req zone=admin burst=10 nodelay;
        
        # Additional security headers for admin
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        
        # IP whitelist for admin (uncomment and configure as needed)
        # allow 1.2.3.4;  # Your IP
        # deny all;
        
        proxy_pass http://django_backend;
        include /etc/nginx/proxy.conf;
    }

    # ==========================================================================
    # AUTHENTICATION ENDPOINTS
    # ==========================================================================
    location ~ ^/api/v1/(auth|user)/(login|register|pin|verify) {
        # Very strict rate limiting for auth
        limit_req zone=auth burst=5 nodelay;
        
        # Additional security
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        
        proxy_pass http://django_backend;
        include /etc/nginx/proxy.conf;
        
        # Special logging for authentication attempts
        access_log /var/log/nginx/auth.log json;
    }

    # ==========================================================================
    # FILE UPLOAD ENDPOINTS
    # ==========================================================================
    location ~ ^/api/v1/.*/upload {
        # Rate limiting for uploads
        limit_req zone=uploads burst=3 nodelay;
        
        # Increase timeouts for uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        proxy_pass http://django_backend;
        include /etc/nginx/proxy.conf;
    }

    # ==========================================================================
    # API ENDPOINTS
    # ==========================================================================
    location /api/ {
        # Standard rate limiting for API
        limit_req zone=api burst=20 nodelay;
        
        # API-specific headers
        add_header X-API-Version "1.0" always;
        
        proxy_pass http://django_backend;
        include /etc/nginx/proxy.conf;
    }

    # ==========================================================================
    # HEALTH CHECK
    # ==========================================================================
    location ~ ^/(health|status|ping)/?$ {
        # No rate limiting for health checks
        proxy_pass http://django_backend;
        
        # Minimal headers for health checks
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Fast timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        # No buffering
        proxy_buffering off;
        
        # No logging
        access_log off;
    }

    # ==========================================================================
    # WEBSOCKET SUPPORT
    # ==========================================================================
    location /ws/ {
        proxy_pass http://django_backend;
        
        # WebSocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Long timeouts for WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # No buffering
        proxy_buffering off;
    }

    # ==========================================================================
    # DEFAULT LOCATION
    # ==========================================================================
    location / {
        proxy_pass http://django_backend;
        include /etc/nginx/proxy.conf;
    }

    # ==========================================================================
    # SECURITY BLOCKS
    # ==========================================================================
    
    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block common attack vectors
    location ~* /(wp-admin|wp-content|wp-config|wp-includes|phpmyadmin|adminer) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block sensitive files
    location ~* \.(env|log|ini|conf|bak|old|backup|sql|gz|tar|zip)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================================================
    # SEO AND ROBOTS
    # ==========================================================================
    location = /robots.txt {
        access_log off;
        log_not_found off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /admin/\nDisallow: /api/\nSitemap: https://api.asoud.ir/sitemap.xml\n";
    }
    
    location = /sitemap.xml {
        proxy_pass http://django_backend;
        include /etc/nginx/proxy.conf;
        expires 1d;
    }

    # ==========================================================================
    # FAVICON
    # ==========================================================================
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /static/favicon.ico =204;
    }
}

# =============================================================================
# SUBDOMAIN REDIRECT (if needed)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name asoud.ir www.asoud.ir;
    
    # Use same SSL certificate
    ssl_certificate /etc/letsencrypt/live/api.asoud.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.asoud.ir/privkey.pem;
    
    # Redirect to main API domain
    return 301 https://api.asoud.ir$request_uri;
}