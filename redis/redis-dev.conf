# Redis Configuration for Development Environment
# =============================================================================

# Network and Security
bind 0.0.0.0
protected-mode yes
port 6379

# Authentication
requirepass redis_dev_pass

# Memory Management for Development
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence for Development (more frequent saves)
save 900 1      # Save after 900 sec if at least 1 key changed
save 300 10     # Save after 300 sec if at least 10 keys changed
save 60 10000   # Save after 60 sec if at least 10000 keys changed

# Background saving
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Logging for Development
loglevel notice
logfile /data/redis-dev.log

# Slow log for performance monitoring
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client settings
timeout 300
tcp-keepalive 300

# Performance tuning for development
databases 16
tcp-backlog 511

# Disable dangerous commands in development
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_RENAMED_FOR_SECURITY"

# Enable keyspace notifications for debugging
notify-keyspace-events "Ex"