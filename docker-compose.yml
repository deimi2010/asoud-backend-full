name: asoud-v1

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: asoud_feature_migrations
      POSTGRES_USER: asoud
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asoud -d asoud_feature_migrations"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-dev-ml
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.migration_dev
      DATABASE_NAME: asoud_feature_migrations
      DATABASE_USERNAME: asoud
      DATABASE_PASSWORD: ""
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ASOUD_LOCAL_BOOTSTRAP: "1"
      ASOUD_TRUSTED_PROXY_CIDRS: 172.30.0.0/24
      CHAT_GROUP_MAX_PARTICIPANTS: "100"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - ml_artifacts:/app/ml_artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../fluter-sina
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:8080/api/v1/
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  ml_artifacts:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
