# Development NGINX Configuration for ASOUD Platform
# =============================================================================

# Upstream configuration with health checks
upstream django_dev {
    server asoud_api_dev:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limiting zones (more relaxed for development)
limit_req_zone $binary_remote_addr zone=api_limit_dev:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=admin_limit_dev:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit_dev:10m rate=10r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit_dev:10m;

server {
    listen 80;
    server_name localhost 127.0.0.1 *.asoud.local;
    
    # Client settings (more permissive for development)
    client_max_body_size 500M;
    client_body_buffer_size 256k;
    client_header_buffer_size 2k;
    large_client_header_buffers 8 32k;
    
    # Timeouts (longer for development debugging)
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    
    # Connection limits (higher for development)
    limit_conn conn_limit_dev 100;
    
    # Compression (GZIP) - enabled for development testing
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    
    # Static files with caching for development
    location /static/ {
        alias /asoud/static/;
        expires 1h;
        add_header Cache-Control "public, immutable";
        add_header X-Static-File-Server "nginx-dev";
        
        # CORS headers for development
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        
        # Optimization
        sendfile on;
        tcp_nopush on;
        
        # Development logging
        access_log /var/log/nginx/static_access.log;
        
        # Handle missing files
        try_files $uri =404;
    }
    
    # Media files with upload support
    location /media/ {
        alias /asoud/media/;
        expires 1d;
        add_header X-Media-File-Server "nginx-dev";
        
        # CORS headers for development
        add_header Access-Control-Allow-Origin "*";
        
        # Optimization
        sendfile on;
        tcp_nopush on;
        
        # Development logging
        access_log /var/log/nginx/media_access.log;
        
        # Handle missing files
        try_files $uri =404;
    }
    
    # Admin panel with relaxed rate limiting
    location /admin/ {
        limit_req zone=admin_limit_dev burst=50 nodelay;
        
        proxy_pass http://django_dev;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        
        # Development headers
        add_header X-Development-Mode "true";
        add_header X-Proxy-Server "nginx-dev";
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
        
        # Timeouts (longer for development)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Disable redirect rewriting
        proxy_redirect off;
        
        # Development logging
        access_log /var/log/nginx/admin_access.log;
    }
    
    # API endpoints with development-friendly rate limiting
    location /api/ {
        limit_req zone=api_limit_dev burst=100 nodelay;
        
        proxy_pass http://django_dev;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        
        # Development headers
        add_header X-Development-Mode "true";
        add_header X-API-Server "nginx-dev";
        
        # CORS headers for development
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_redirect off;
        
        # Development logging
        access_log /var/log/nginx/api_access.log;
    }
    
    # Health check endpoint (no rate limit for development)
    location ~ ^/(health|api/v1/health)/ {
        proxy_pass http://django_dev;
        proxy_http_version 1.1;
        
        # Minimal headers for health check
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Fast timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        # No buffering for health checks
        proxy_buffering off;
        
        # No logging for health checks
        access_log off;
    }
    
    # WebSocket support for development
    location /ws/ {
        proxy_pass http://django_dev;
        proxy_http_version 1.1;
        
        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Development headers
        add_header X-Development-Mode "true";
        add_header X-WebSocket-Server "nginx-dev";
        
        # Long timeouts for WebSocket development
        proxy_connect_timeout 1d;
        proxy_send_timeout 1d;
        proxy_read_timeout 1d;
        
        # No buffering for WebSocket
        proxy_buffering off;
        
        # Development logging
        access_log /var/log/nginx/websocket_access.log;
    }
    
    # Development tools proxying
    location /adminer/ {
        proxy_pass http://asoud_adminer_dev:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location /redis/ {
        proxy_pass http://asoud_redis_commander_dev:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location /mail/ {
        proxy_pass http://asoud_mailhog_dev:8025/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # All other requests
    location / {
        proxy_pass http://django_dev;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        
        # Development headers
        add_header X-Development-Mode "true";
        add_header X-Main-Server "nginx-dev";
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_redirect off;
        
        # Development logging
        access_log /var/log/nginx/main_access.log;
    }
    
    # Development utilities
    location /nginx-status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker networks
        allow 192.168.0.0/16; # Private networks
        deny all;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Development error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# Development HTTPS server (self-signed certificates)
server {
    listen 443 ssl http2;
    server_name localhost 127.0.0.1 *.asoud.local;
    
    # Self-signed SSL certificates for development
    ssl_certificate /etc/nginx/ssl/dev.crt;
    ssl_certificate_key /etc/nginx/ssl/dev.key;
    
    # SSL configuration for development
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # Include the same location blocks as HTTP
    include /etc/nginx/conf.d/common-locations.conf;
}